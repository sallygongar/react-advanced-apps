<svg xmlns="http://www.w3.org/2000/svg" width="48" height="46" viewBox="0 0 48 46" fill="none">
  <!-- Pétalos (Capa Trasera) -->
  <g fill="#F59E0B">
    <ellipse cx="24" cy="7" rx="3.5" ry="9" transform="rotate(15 24 23)"/>
    <ellipse cx="24" cy="7" rx="3.5" ry="9" transform="rotate(45 24 23)"/>
    <ellipse cx="24" cy="7" rx="3.5" ry="9" transform="rotate(75 24 23)"/>
    <ellipse cx="24" cy="7" rx="3.5" ry="9" transform="rotate(105 24 23)"/>
    <ellipse cx="24" cy="7" rx="3.5" ry="9" transform="rotate(135 24 23)"/>
    <ellipse cx="24" cy="7" rx="3.5" ry="9" transform="rotate(165 24 23)"/>
    <ellipse cx="24" cy="7" rx="3.5" ry="9" transform="rotate(195 24 23)"/>
    <ellipse cx="24" cy="7" rx="3.5" ry="9" transform="rotate(225 24 23)"/>
    <ellipse cx="24" cy="7" rx="3.5" ry="9" transform="rotate(255 24 23)"/>
    <ellipse cx="24" cy="7" rx="3.5" ry="9" transform="rotate(285 24 23)"/>
    <ellipse cx="24" cy="7" rx="3.5" ry="9" transform="rotate(315 24 23)"/>
    <ellipse cx="24" cy="7" rx="3.5" ry="9" transform="rotate(345 24 23)"/>
  </g>

  <!-- Pétalos (Capa Principal) -->
  <g fill="#FBBF24">
    <ellipse cx="24" cy="7" rx="4.5" ry="11" transform="rotate(0 24 23)"/>
    <ellipse cx="24" cy="7" rx="4.5" ry="11" transform="rotate(30 24 23)"/>
    <ellipse cx="24" cy="7" rx="4.5" ry="11" transform="rotate(60 24 23)"/>
    <ellipse cx="24" cy="7" rx="4.5" ry="11" transform="rotate(90 24 23)"/>
    <ellipse cx="24" cy="7" rx="4.5" ry="11" transform="rotate(120 24 23)"/>
    <ellipse cx="24" cy="7" rx="4.5" ry="11" transform="rotate(150 24 23)"/>
    <ellipse cx="24" cy="7" rx="4.5" ry="11" transform="rotate(180 24 23)"/>
    <ellipse cx="24" cy="7" rx="4.5" ry="11" transform="rotate(210 24 23)"/>
    <ellipse cx="24" cy="7" rx="4.5" ry="11" transform="rotate(240 24 23)"/>
    <ellipse cx="24" cy="7" rx="4.5" ry="11" transform="rotate(270 24 23)"/>
    <ellipse cx="24" cy="7" rx="4.5" ry="11" transform="rotate(300 24 23)"/>
    <ellipse cx="24" cy="7" rx="4.5" ry="11" transform="rotate(330 24 23)"/>
  </g>

  <!-- Letras "S A L L Y" dentro de los pétalos superiores -->
  <g fill="#78350F" font-family="Arial, sans-serif" font-weight="bold" font-size="4" text-anchor="middle">
    <text x="10" y="16" transform="rotate(-60 10 16)">S</text>
    <text x="16" y="10" transform="rotate(-30 16 10)">A</text>
    <text x="24" y="8">L</text>
    <text x="32" y="10" transform="rotate(30 32 10)">L</text>
    <text x="38" y="16" transform="rotate(60 38 16)">Y</text>
  </g>

  <!-- Centro de la Flor -->
  <circle cx="24" cy="23" r="10" fill="#78350F"/>
  <circle cx="24" cy="23" r="8" fill="#451A03"/>

  <!-- Textura del Centro -->
  <g fill="#D97706" opacity="0.6">
    <circle cx="21" cy="20" r="1"/>
    <circle cx="25" cy="19" r="1"/>
    <circle cx="27" cy="23" r="1"/>
    <circle cx="23" cy="26" r="1"/>
    <circle cx="19" cy="23" r="1"/>
  </g>
</svg>
