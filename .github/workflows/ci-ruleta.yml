name: CI ruleta

on:
  pull_request:
    paths:
      - "ruleta/**"
      - ".github/workflows/ci-ruleta.yml"
  push:
    branches: [main]
    paths:
      - "ruleta/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruleta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ruleta/package-lock.json

      - run: npm ci
      #- run: npm run lint
      - run: npm run test:run
      - run: npm run build
